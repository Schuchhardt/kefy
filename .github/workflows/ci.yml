name: CI

# Tests en cada push y PR; al mergear a main, además, migraciones en producción.
#
# La base de Supabase es COMPARTIDA con AI Tickets: el runner
# (scripts/migrate.mjs) lleva su propio historial en kefy_schema_migrations, solo
# acepta migraciones nuevas que toquen objetos kefy_* y nunca usa
# `supabase db push`. Ver docs/migraciones.md.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret-at-least-32-characters-long!!' }}
          ZERNIO_API_KEY: test-key
          ZERNIO_API_URL: https://zernio.com/api/v1
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  # E2E tests (Playwright) only run locally — require a configured DB/env.
  # Run with: `npm run test:e2e`

  migrations-check:
    name: Migraciones (validación)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Sin base ni dependencias: nombres, versiones y reglas de la base compartida.
      - run: node scripts/migrate.mjs --check

  migrate:
    name: Migraciones (producción)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-tests, migrations-check]
    runs-on: ubuntu-latest
    # El secreto solo existe en este environment: un PR nunca ve la conexión.
    environment: production
    # Nunca dos migraciones a la vez ni una cancelada a medias.
    concurrency:
      group: kefy-db-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Pendientes
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/migrate.mjs --status

      - name: Aplicar
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/migrate.mjs
